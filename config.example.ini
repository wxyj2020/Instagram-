[proxy]
# Proxy template. Empty = no proxy (requests leave from this machine and hit 429 fast).
#
# socks5h:// and http:// are supported.
# {sid} is replaced with a per-worker value derived from the account uid, so every
# worker keeps its own sticky egress IP. A literal "sessid-xxxx" is rewritten too.
#
# Examples:
# url = socks5h://username:password@gate.example.com:1080
# url = socks5h://username:password@gate.example.com:1080?sessid={sid}
# url = http://username:password@gate.example.com:8080

url =


[client]
# Client identity -- required, no defaults.
# These values change with every app release; capture them from a logged-in app
# (Charles / Proxyman / mitmproxy):
#   User-Agent: Instagram <app_version> Android (...; <version_code>)
#   request header x-bloks-version-id: <bloks_version>
#
# ua may be left empty: an Android UA is built from app_version / version_code.

app_version =
version_code =
bloks_version =
ua =
