[proxy]
# 代理模板, 留空 = 不走代理(从本机 IP 出, 容易 429)
#
# 支持 socks5h:// 和 http://
# 模板里的 {sid} 会按每个工作号的 uid 替换成独立值, 让一个号固定走一个出口 IP。
# 没有 {sid} 时, 如果模板含 "sessid-xxxx", 也会自动替换成按号派生的值。
#
# 例:
# url = socks5h://username:password@gate.example.com:1080
# url = socks5h://username:password@gate.example.com:1080?sessid={sid}
# url = http://username:password@gate.example.com:8080

url =
