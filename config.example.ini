[proxy]
# 代理模板, 留空 = 不走代理(从本机 IP 出, 容易 429)
#
# 支持 socks5h:// 和 http://
# 模板里的 {sid} 会按每个工作号的 uid 替换成独立值, 让一个号固定走一个出口 IP。
# 没有 {sid} 时, 如果模板含 "sessid-xxxx", 也会自动替换成按号派生的值。
#
# 例:
# url = socks5h://username:password@gate.example.com:1080
# url = socks5h://username:password@gate.example.com:1080?sessid={sid}
# url = http://username:password@gate.example.com:8080

url =


[client]
# 客户端标识 —— 不带任何默认值, 必填。
# 这些值随 App 版本变化, 请用抓包工具(Charles / Proxyman / mitmproxy)
# 看一个已登录 App 的请求:
#   User-Agent: Instagram <app_version> Android (...; <version_code>)
#   请求头 x-bloks-version-id: <bloks_version>
#
# ua 可留空: 会按 app_version / version_code 自动拼一个安卓 UA。

app_version =
version_code =
bloks_version =
ua =
